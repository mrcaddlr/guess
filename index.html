<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0d0d12">
  <meta name="description" content="guess — a fast image guessing game for movies, TV, anime, games, characters, consoles, and more.">
  <title>guess — image guessing game</title>
  <link rel="stylesheet" href="style.css?v=7">
  <script type="module">
    try {
      const { LiquidGlass } = await import("https://cdn.jsdelivr.net/npm/@ybouane/liquidglass/dist/index.js");
      window.LiquidGlass = LiquidGlass;
      window.dispatchEvent(new Event("liquidglassready"));
    } catch (error) {
      console.warn("Liquid Glass unavailable; using CSS fallback.", error);
    }
  </script>
</head>
<body>
  <div class="liquid-bg" aria-hidden="true"></div>
  <main class="app liquid-glass-surface">
    <header class="topbar">
      <a id="homeBrand" class="brand" href="#home" aria-label="guess home">guess</a>
      <div class="stats" aria-label="Game score">
        <span>score <b id="score">0</b></span>
        <span>streak <b id="streak">0</b></span>
      </div>
    </header>

    <section id="home" class="screen active" aria-labelledby="homeTitle">
      <div class="hero">
        <p class="eyebrow">IMAGE GUESSING GAME</p>
        <h1 id="homeTitle">guess what<br>you see.</h1>
        <p>movies, tv, anime, games, characters, consoles, people, places, and a lot more.</p>
      </div>
      <div class="section-head">
        <h2>choose a category</h2>
        <button id="randomCategory" class="ghost" type="button">random</button>
      </div>
      <div id="categories" class="category-grid"></div>
    </section>

    <section id="game" class="screen" aria-labelledby="categoryLabel">
      <div class="game-head">
        <button id="backHome" class="ghost" type="button">← categories</button>
        <div>
          <p id="categoryLabel" class="eyebrow"></p>
          <h2 id="roundLabel">round 1</h2>
        </div>
        <div class="round-score">+<span id="lastPoints">0</span></div>
      </div>

      <div class="card">
        <div id="imageWrap" class="image-wrap">
          <div class="loading" role="status" aria-live="polite">finding an image…</div>
          <img id="questionImage" alt="Mystery image" hidden decoding="async">
          <a id="sourceCredit" class="source-credit" target="_blank" rel="noopener noreferrer" hidden></a>
        </div>

        <div class="question">
          <p class="eyebrow">WHAT IS THIS?</p>
          <h1 id="questionHint">type your answer</h1>
          <form id="answerForm" autocomplete="off">
            <input id="answer" autocapitalize="none" autocomplete="off" spellcheck="false" placeholder="your guess…" aria-label="Your guess">
            <button type="submit">guess</button>
          </form>
          <div class="actions">
            <button id="skip" class="text-btn" type="button">skip</button>
            <button id="reveal" class="text-btn" type="button">reveal</button>
          </div>
          <p id="feedback" class="feedback" aria-live="polite"></p>
        </div>
      </div>
    </section>
  </main>
  <script src="vision.js?v=2"></script>
  <script src="app.js?v=12"></script>
</body>
</html>
